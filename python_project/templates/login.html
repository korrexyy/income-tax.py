<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 30px; border-radius: 16px; width: 320px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #38bdf8; color: white; cursor: pointer; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p>{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}
    <form method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don’t have an account? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</body>
</html>
