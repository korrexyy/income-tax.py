<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserve a Table | R3X COFFI</title>
    <link rel="stylesheet" href="index1.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">R3X COFFI</div>
        <div class="navlinks">
          <a href="menu.html">Menu</a>
          <a href="visit.html">Visit</a>
          <a href="reserve.html">Reserve</a>
        </div>
      </nav>
      <hr />
    </header>

    <main class="page-content">
      <section class="page-hero">
        <p class="page-tag">RESERVE • TABLE • MOMENTS</p>
        <h1>Reserve a table for your next coffee date or workspace escape.</h1>
        <p>Tell us when you’re coming and we’ll hold a spot for you.</p>
      </section>

      <section class="info-card form-card">
        <form>
          <label>
            Your name
            <input type="text" placeholder="Ada Lovelace" />
          </label>
          <label>
            Email
            <input type="email" placeholder="you@example.com" />
          </label>
          <label>
            Date
            <input type="date" />
          </label>
          <label>
            Guests
            <input type="number" min="1" max="8" value="2" />
          </label>
          <button type="submit">Reserve now</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 R3XXi COFFI</p>
    </footer>
  </body>
